name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  java:
    name: Java checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Java quality gates
        run: ./gradlew --no-daemon compileJava compileTestJava checkstyleMain checkstyleTest test jacocoTestReport jacocoTestCoverageVerification
        working-directory: java

      - name: Upload Java coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          files: java/sim-*/build/reports/jacoco/test/jacocoTestReport.xml
          flags: java
          fail_ci_if_error: false

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ui

      - name: Run frontend quality gates
        run: |
          npm run lint
          npx tsc --noEmit
          npm run test:coverage
          npm run build
          npm audit --audit-level=high
        working-directory: ui

      - name: Upload frontend coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          files: ui/coverage/coverage-final.json
          flags: frontend
          fail_ci_if_error: false

      - name: Upload audit reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: security-audit-reports
          path: |
            ui/npm-audit.json

  playwright:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build API JAR
        run: ./gradlew --no-daemon :sim-cli:bootJar
        working-directory: java

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: npm ci
        working-directory: ui

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('ui/package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        # ubuntu-latest runners have Chromium system dependencies pre-installed;
        # --with-deps triggers a large apt install on every run (not cached)
        # and was causing multi-minute hangs even after the browser cache hit.
        run: npx playwright install chromium
        working-directory: ui

      - name: Run Playwright tests
        run: npx playwright test
        working-directory: ui

  docker:
    name: Docker compose build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build images
        run: docker compose build

      - name: Docker smoke test
        run: |
          cp .env.example .env
          docker compose up -d --wait --wait-timeout 120
          curl -sf http://localhost:3000/api/health > /dev/null
          curl -sf "http://localhost:${UI_PORT:-5173}/health" > /dev/null

      - name: Print startup logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down containers
        if: always()
        run: docker compose down

  java-audit:
    name: Java dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Generate CycloneDX SBOM
        run: ./gradlew --no-daemon cyclonedxBom
        working-directory: java

      - name: Install Trivy
        run: |
          TRIVY_VERSION=0.69.3
          curl -fsSL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" -o /tmp/trivy.tar.gz
          tar -xzf /tmp/trivy.tar.gz -C /tmp
          install /tmp/trivy /usr/local/bin/trivy
          trivy --version

      - name: Scan SBOM with Trivy
        run: trivy sbom --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 java/build/reports/cyclonedx/bom.json

  docker-scan:
    name: Docker image scan (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: .
          - image: ui
            context: ui
    steps:
      - uses: actions/checkout@v7
      - name: Install Trivy
        run: |
          TRIVY_VERSION=0.69.3
          curl -fsSL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" -o /tmp/trivy.tar.gz
          tar -xzf /tmp/trivy.tar.gz -C /tmp
          install /tmp/trivy /usr/local/bin/trivy
          trivy --version
      - name: Build image
        run: docker build -t arcogine-${{ matrix.image }}:ci ${{ matrix.context }}
      - name: Scan image with Trivy
        run: trivy image --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 arcogine-${{ matrix.image }}:ci

  security-secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar xz -C /usr/local/bin gitleaks
      - name: Run Gitleaks
        run: gitleaks detect --source . --config .gitleaks.toml --verbose
