name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 5 * * *' # daily security re-scan (findings can change without repo changes)
  workflow_dispatch: {}

# Cancel a superseded PR run when a newer commit is pushed to the same PR/branch.
# Non-PR events (push to main, schedule, workflow_dispatch) each get a group unique
# to their own run_id, so they never share a group and GitHub's default
# only-one-pending-run-per-group behavior can never drop or cancel one of them.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TRIVY_VERSION: 0.69.3
  TRIVY_SHA256: 1816b632dfe529869c740c0913e36bd1629cb7688bd5634f4a858c1d57c88b75
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  # Classifies the diff into broad surfaces so unaffected work can be skipped.
  # Conservative by design: CI/tooling changes and shared manifests default every
  # downstream flag to true rather than risk a false skip.
  classify:
    name: Classify changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      docs_only: ${{ steps.filter.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node for tooling tests
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.2'

      - name: Validate repository tooling
        run: bash .github/scripts/check-repository-tooling.sh

      - name: Determine changed-file surfaces
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail

          if files=$(bash .github/scripts/discover-changed-files.sh "$EVENT_NAME" "$PR_BASE_SHA" "$PUSH_BEFORE" "$PUSH_AFTER"); then
            :
          else
            status=$?
            if [ "$EVENT_NAME" = "pull_request" ] && [ "$status" -eq 2 ]; then
              echo "::warning::The pull request event base commit '$PR_BASE_SHA' is unavailable locally; classifying all tracked files to conservatively select executable validation. No network fetch was attempted."
            else
              exit "$status"
            fi
          fi

          echo "Changed files:"
          echo "$files"

          printf '%s\n' "$files" | bash .github/scripts/classify-changes.sh | tee -a "$GITHUB_OUTPUT"

  java:
    name: Java checks
    needs: classify
    if: needs.classify.outputs.backend == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Run Java quality gates
        run: ./gradlew --no-daemon compileJava compileTestJava checkstyleMain checkstyleTest test jacocoTestReport jacocoTestCoverageVerification
        working-directory: product

      - name: Upload Java coverage to Codecov
        if: always()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: product/*/build/reports/jacoco/test/jacocoTestReport.xml,product/domains/*/build/reports/jacoco/test/jacocoTestReport.xml,product/consumer/*/build/reports/jacoco/test/jacocoTestReport.xml
          flags: java
          fail_ci_if_error: false

  java-audit:
    name: Java dependency audit
    needs: classify
    if: needs.classify.outputs.backend == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Generate CycloneDX SBOM
        run: ./gradlew --no-daemon cyclonedxBom
        working-directory: product

      - name: Install Trivy
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" -o /tmp/trivy.tar.gz
          echo "${TRIVY_SHA256}  /tmp/trivy.tar.gz" | sha256sum -c -
          tar -xzf /tmp/trivy.tar.gz -C /tmp
          install /tmp/trivy /usr/local/bin/trivy
          trivy --version

      - name: Scan SBOM with Trivy
        run: trivy sbom --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 product/build/reports/cyclonedx/bom.json

  security-secrets:
    name: Secret scan
    # Always runs, even for docs-only changes and non-classification event types.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar xz -C /usr/local/bin -f /tmp/gitleaks.tar.gz gitleaks
      - name: Run Gitleaks
        run: gitleaks detect --source . --config .github/security/gitleaks.toml --verbose

  # Stable aggregate CI validation signal. Keep this needs: list in sync with
  # the expected-job map in .github/scripts/check-ci-gate.mjs when jobs are
  # added, removed, or their conditions change. The evaluator fails closed if
  # their key sets drift, rather than silently accepting an unexamined job.
  gate:
    name: gate
    if: always()
    needs:
      - classify
      - java
      - java-audit
      - security-secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BACKEND: ${{ needs.classify.outputs.backend }}
      EVENT_NAME: ${{ github.event_name }}
      NEEDS_JSON: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.2'
      - name: Check required job results
        run: node .github/scripts/check-ci-gate.mjs
