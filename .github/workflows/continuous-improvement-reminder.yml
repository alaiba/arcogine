name: Continuous Improvement Reminder

on:
  schedule:
    - cron: '17 8 * * 1'
concurrency:
  group: continuous-improvement-reminder
  cancel-in-progress: false

permissions:
  issues: write

jobs:
  remind:
    name: Create checkpoint reminder
    runs-on: ubuntu-latest
    steps:
      - name: Create reminder issue if none is open
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TITLE: Continuous improvement checkpoint
        shell: bash
        run: |
          set -euo pipefail

          if gh api --paginate "repos/${REPO}/issues?state=open&per_page=100" \
            --jq '.[] | select(.pull_request == null) | .title' \
            | grep -Fxq "$TITLE"; then
            echo "Continuous improvement checkpoint already open."
            exit 0
          fi

          body_file="${RUNNER_TEMP}/continuous-improvement-checkpoint.md"
          cat > "$body_file" <<'EOF'
          Run the repository's **Continuous Improvement** agent and review its recommendations.

          Suggested invocation:

          `Assess continuous improvement.`

          The assessment scans pull requests merged into `main` and non-PR issues closed since the preceding checkpoint opened, then recommends the smallest worthwhile next practice, focused test-evidence diagnostic, or narrow process-tightening action. Deeper trend, recurrence, effectiveness, and cost analysis belongs to the owning specialized practice.

          Agent contract: `.github/agents/continuous-improvement.agent.md`

          This issue is only a reminder. The workflow does not calculate due state, inspect repository health, or run Consistency, a retrospective, or any other improvement practice. Close the issue after the assessment; while it remains open, scheduled runs will not create another reminder.
          EOF

          gh issue create \
            --repo "$REPO" \
            --title "$TITLE" \
            --body-file "$body_file"
