name: Continuous improvement register

# Bootstraps and updates Arcogine's continuous-improvement register issue and
# derives recurring-obligation due state. See
# docs/development/continuous-improvement.md for the operating model.
#
# This workflow is deliberately separate from ordinary product CI (ci.yml) and
# never invokes the Consistency agent, a delivery-process retrospective, or any
# other judgment-bearing improvement work. Its only job is to make missed
# recurring obligations visible: bootstrap/find the register issue, derive
# CURRENT/DUE/OVERDUE/CHECK_TRIGGER state, and update only the workflow-owned
# marker region of the issue body.
#
# TRUST BOUNDARY: this file is intentionally a thin, unprivileged dispatcher.
# It holds no permissions of its own and contains no logic beyond a single
# `uses:` call into .github/workflows/continuous-improvement-impl.yml, pinned
# by a full `owner/repo/path@main` reusable-workflow reference rather than a
# same-repo `./...` reference. GitHub always resolves that form of reference
# against the content of the pinned ref (`main`), regardless of which ref
# triggered *this* file -- so even a `workflow_dispatch` invocation against an
# arbitrary branch still executes main's copy of the actual (issues:write)
# logic, not a branch-controlled copy. See continuous-improvement-impl.yml's
# own header for the precise mechanism and its residual-risk note (a
# collaborator editing this file's own `uses:` line is bounded by requiring
# independent review of `.github/workflows/` changes before that edit can land
# on `main`, per `.github/CODEOWNERS`).
#   - `schedule` and `push` (restricted to `branches: [main]`) always load this
#     file's own definition from `main` in the first place.
#   - `workflow_dispatch` may load this file's definition from an arbitrary
#     dispatched ref, but that only controls which (trivial, no-permission)
#     dispatcher body runs -- the pinned `uses:` reference below still always
#     executes main's impl workflow.

on:
  schedule:
    # Weekly, Monday 06:00 UTC. The exact time is not semantically important;
    # this is simply a stable, documented slot distinct from ci.yml's daily
    # 05:00 UTC security re-scan.
    - cron: '0 6 * * 1'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/scripts/continuous-improvement.mjs'
      - '.github/scripts/continuous-improvement-data.json'
      - '.github/workflows/continuous-improvement.yml'
      - '.github/workflows/continuous-improvement-impl.yml'
      - 'docs/development/continuous-improvement.md'

permissions: {}

concurrency:
  group: continuous-improvement-register
  cancel-in-progress: false

jobs:
  update-register:
    name: Bootstrap/update register
    permissions:
      contents: read
      issues: write
      pull-requests: read
    uses: alaiba/arcogine/.github/workflows/continuous-improvement-impl.yml@main
