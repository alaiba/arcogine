name: Continuous improvement register

# Maintains time/count-derived status in register issue #295.
# It never performs a Consistency review or delivery-process retrospective.
# A Consistency review records its own completion directly in the register body;
# this workflow is not part of that completion path.

on:
  schedule:
    - cron: '0 6 * * *'
  push:
    branches: [main]
    paths:
      - '.github/scripts/continuous-improvement.mjs'
      - '.github/scripts/continuous-improvement.test.mjs'
      - '.github/scripts/continuous-improvement-data.json'
      - '.github/workflows/continuous-improvement.yml'
      - 'docs/development/continuous-improvement.md'

permissions:
  contents: read

concurrency:
  group: continuous-improvement-register
  cancel-in-progress: false

jobs:
  update-register:
    name: Refresh derived register state
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read

    steps:
      - name: Check out trusted main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate helper logic
        run: node --test .github/scripts/continuous-improvement.test.mjs

      - name: Refresh continuous improvement register
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/continuous-improvement.mjs
