name: Continuous improvement register

# Bootstraps and updates Arcogine's continuous-improvement register issue and
# derives recurring-obligation due state. See
# docs/development/continuous-improvement.md for the operating model.
#
# This workflow is deliberately separate from ordinary product CI (ci.yml) and
# never invokes the Consistency agent, a delivery-process retrospective, or any
# other judgment-bearing improvement work. Its only job is to make missed
# recurring obligations visible: bootstrap/find the register issue, derive
# CURRENT/DUE/OVERDUE/CHECK_TRIGGER state, and update only the workflow-owned
# marker region of the issue body.
#
# TRUST BOUNDARY: `schedule` and `push` (restricted to `branches: [main]`)
# always load this file's own definition from `main`, so those two triggers
# only ever run reviewed content.
#
# `workflow_dispatch` does not have that property, and no construct in this
# file or continuous-improvement-impl.yml can give it that property: GitHub
# always executes a dispatched ref's own copy of the workflow definition,
# including whatever `uses:`/`permissions:` that copy declares, with whatever
# permissions it requests up to the repository's allowed ceiling. A prior
# revision of this file claimed that pinning the `uses:` reference below to
# `@main` closed that gap; it does not, because this file's own `uses:` and
# `permissions:` lines are themselves part of the dispatched ref's content and
# can be rewritten by whoever dispatches it. See
# continuous-improvement-impl.yml's header for the actual enforcement point
# (a repository Environment with a branch-restricted deployment policy,
# configured outside git content) and its current setup status.

on:
  schedule:
    # Weekly, Monday 06:00 UTC. The exact time is not semantically important;
    # this is simply a stable, documented slot distinct from ci.yml's daily
    # 05:00 UTC security re-scan.
    - cron: '0 6 * * 1'
  workflow_dispatch: {} # see the TRUST BOUNDARY note above for this trigger's actual guarantees
  push:
    branches: [main]
    paths:
      - '.github/scripts/continuous-improvement.mjs'
      - '.github/scripts/continuous-improvement-data.json'
      - '.github/workflows/continuous-improvement.yml'
      - '.github/workflows/continuous-improvement-impl.yml'
      - 'docs/development/continuous-improvement.md'

permissions: {}

concurrency:
  group: continuous-improvement-register
  cancel-in-progress: false

jobs:
  update-register:
    name: Bootstrap/update register
    permissions:
      contents: read
      issues: write
      pull-requests: read
    uses: alaiba/arcogine/.github/workflows/continuous-improvement-impl.yml@main
