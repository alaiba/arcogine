name: Documentation links

on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.md'
      - '.github/scripts/check-markdown-links.py'
      - '.github/workflows/docs-links.yml'
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - '.github/scripts/check-markdown-links.py'
      - '.github/workflows/docs-links.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  local-links:
    name: Repository-local Markdown links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check repository-local Markdown links
        run: python3 .github/scripts/check-markdown-links.py .
