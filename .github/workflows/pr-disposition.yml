name: PR Disposition

# PR disposition merge-gate workflow.
#
# Enforces exactly one invariant: the latest applicable canonical reviewer
# disposition for the current PR head must be READY TO MERGE. This workflow
# does not evaluate CI, mergeability, or unresolved threads — those remain
# independently enforced by GitHub branch protection and infra/dev/pr-watch.mjs.
#
# TRUST BOUNDARY (this is why the triggers below look unusual):
#
# A candidate PR must not be able to author the code that judges its own
# disposition. Checking out the evaluator script from a trusted `main` ref is
# not sufficient on its own: GitHub sources a `pull_request` or
# `pull_request_review` triggered workflow's *definition* from the pull
# request's own merge commit, not from `main`. A PR could therefore edit this
# very file to skip the evaluator and fabricate a passing result.
#
# Three trusted-orchestration triggers, none of which ever checks out or
# executes PR-supplied code:
#   - `pull_request_target` for PR lifecycle events (opened/reopened/
#     synchronize). GitHub always loads a pull_request_target workflow's
#     definition from the base branch (main), never from the PR.
#   - `workflow_run`, chained from the minimal, unprivileged, no-checkout
#     listener in pr-disposition-review-trigger.yml, as a fast path for
#     review events. pull_request_review has no trusted "_target" variant,
#     so the listener (sourced from the PR, but inert) reacts to the review;
#     workflow_run (always sourced from main) reacts to the listener's
#     completion and independently re-derives the PR number, head SHA, and
#     review bodies via the API -- it never trusts anything the untrusted
#     listener run produced.
#   - `schedule`, as a trusted backstop that does NOT depend on the listener
#     at all. The listener's own `pull_request_review.types` list is itself
#     PR-editable content (this workflow file lives on the PR branch): a PR
#     could narrow it to `[submitted]` only, so an initial READY review
#     mints a green disposition but a later edit to CHANGES REQUIRED, or a
#     dismissal of that review, produces no listener run and therefore no
#     re-evaluation -- leaving a stale passing check attached to an
#     unchanged head. `.github/CODEOWNERS` requires an independent owner to
#     review any change under `.github/workflows/`, including that
#     narrowing, before it can merge (see reviewing.md's listener-coverage
#     mitigation). The schedule sweep is always read from the version of
#     this file on the default branch and remains defense-in-depth,
#     re-checking every open PR against `main` on a fixed interval.
#
# Neither `pull_request_target`, `workflow_run`, nor `schedule` implicitly
# attaches a check result to the correct PR head SHA the way a
# `pull_request`-triggered job would, so this workflow explicitly publishes a
# check run against the resolved head SHA via the Checks API.
#
# CHECK-NAME PROVENANCE (see docs/development/reviewing.md's required-check
# provenance section):
# GitHub branch-protection required status checks match by check NAME only,
# not by which workflow produced them. A separate PR-authored workflow
# (triggered by an ordinary, untrusted event) could create its own job named
# "disposition" and satisfy the same required-check name without ever
# running this evaluator. The same `.github/CODEOWNERS` entry mitigates
# this: authoring such a workflow is itself a change under
# `.github/workflows/`, so it requires an owner's independent review and
# approval first.
on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize]
  workflow_run:
    workflows: ["PR Disposition Review Trigger"]
    types: [completed]
  schedule:
    # Bounded staleness backstop, independent of any PR-controlled trigger.
    - cron: '*/10 * * * *'

permissions:
  contents: read
  pull-requests: read
  actions: read
  checks: write

jobs:
  resolve-targets:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.resolve.outputs.targets }}
    steps:
      - name: Resolve PR number(s) to evaluate
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Event values are passed as data via environment variables rather
          # than interpolated directly into shell script text. The workflow-run
          # association is re-fetched from GitHub's API using the run ID instead
          # of serializing the nested pull_requests object into an expression.
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail

          case "${{ github.event_name }}" in
            pull_request_target)
              TARGETS=$(jq -nc --arg n "$EVENT_PR_NUMBER" '[{pr_number: $n}]')
              ;;
            workflow_run)
              case "$EVENT_WORKFLOW_RUN_ID" in
                ''|*[!0-9]*)
                  echo "::error::workflow_run id is not numeric: $EVENT_WORKFLOW_RUN_ID" >&2
                  exit 1
                  ;;
              esac

              # Re-fetch the trusted workflow-run object from GitHub and read
              # its associated PRs there. For a pull_request_review-triggered
              # listener run, head_sha is the ephemeral refs/pull/<n>/merge
              # commit and cannot be resolved through /commits/<sha>/pulls.
              PR_NUMBER=$(gh api \
                "repos/${{ github.repository }}/actions/runs/$EVENT_WORKFLOW_RUN_ID" \
                --jq '.pull_requests[0].number // empty')

              if [ -z "$PR_NUMBER" ]; then
                # GitHub documents pull_requests as possibly empty for fork
                # cases. Fall back to the run's real source branch name.
                PR_NUMBER=$(gh pr list --repo "${{ github.repository }}" --head "$EVENT_HEAD_BRANCH" --state open --json number --jq '.[0].number // empty')
              fi

              if [ -z "$PR_NUMBER" ]; then
                echo "::error::could not resolve an associated pull request for this workflow_run event"
                exit 1
              fi

              TARGETS=$(jq -nc --arg n "$PR_NUMBER" '[{pr_number: $n}]')
              ;;
            schedule)
              TARGETS=$(gh pr list --repo "${{ github.repository }}" --state open --base main --json number --jq 'map({pr_number: (.number | tostring)})')
              ;;
            *)
              echo "::error::unexpected event: ${{ github.event_name }}"
              exit 1
              ;;
          esac

          echo "targets=$(echo "$TARGETS" | jq -c .)" >> "$GITHUB_OUTPUT"
          echo "Resolved targets: $TARGETS"

  check-disposition:
    needs: resolve-targets
    if: needs.resolve-targets.outputs.targets != '[]'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.resolve-targets.outputs.targets) }}
    concurrency:
      group: pr-disposition-${{ matrix.target.pr_number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: Resolve current head SHA
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_PR_NUMBER: ${{ matrix.target.pr_number }}
        run: |
          set -euo pipefail
          PR_NUMBER="$TARGET_PR_NUMBER"
          case "$PR_NUMBER" in
            ''|*[!0-9]*)
              echo "::error::resolved PR number is not numeric: $PR_NUMBER" >&2
              exit 1
              ;;
          esac
          HEAD_SHA=$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER" --jq '.head.sha')
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "Resolved PR #$PR_NUMBER, current head: $HEAD_SHA"

      - name: Fetch authoritative review bodies with pagination
        id: reviews
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PR_NUMBER="${{ steps.pr.outputs.pr_number }}"
          BODIES=$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER/reviews" \
            --paginate \
            --slurp \
            | jq -r '
                add
                | map(select(.author_association == "OWNER" or .author_association == "MEMBER" or .author_association == "COLLABORATOR"))
                | map((.body // "") | @base64)
                | .[]
              ')

          DELIM="REVIEW_BODIES_$(date +%s%N)_$RANDOM"
          {
            echo "review_bodies_b64<<$DELIM"
            echo "$BODIES"
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout repository at main (trusted base)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Run disposition check
        id: evaluate
        env:
          PR_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          REVIEW_BODIES_B64: ${{ steps.reviews.outputs.review_bodies_b64 }}
        run: |
          set +e
          bash .github/scripts/check-pr-disposition.sh
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Publish disposition check
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ "${{ steps.evaluate.outputs.exit_code }}" = "0" ]; then
            CONCLUSION="success"
          else
            CONCLUSION="failure"
          fi

          gh api "repos/${{ github.repository }}/check-runs" \
            -f name="disposition" \
            -f head_sha="${{ steps.pr.outputs.head_sha }}" \
            -f status="completed" \
            -f conclusion="$CONCLUSION" \
            --silent
