name: PR Disposition

# PR disposition merge-gate workflow.
#
# Enforces exactly one invariant: the latest applicable canonical reviewer
# disposition for the current PR head must be READY TO MERGE. This workflow
# does not evaluate CI, mergeability, or unresolved threads — those remain
# independently enforced by GitHub branch protection and infra/dev/pr-watch.mjs.
#
# NOTE: This workflow runs on every qualifying PR event and produces the
# "disposition" status check (the exact check-run name; branch-protection
# required contexts use the check-run name, e.g. "gate", not a
# workflow-qualified label). That check is NOT currently required by the
# branch protection ruleset on main. Full activation additionally requires
# (see docs/development/reviewing.md's "PR disposition merge gate" section):
#   1. adding this exact check-run context to the ruleset's required checks;
#   2. ensuring the identity available to coding agents cannot bypass the
#      required checks at merge time (a PR-only bypass actor can);
#   3. enabling "require branches to be up to date before merging" (or an
#      equivalent base-freshness safeguard), since this gate binds only to
#      the PR head SHA and does not itself detect a base-branch advance.
# Until all three are true, this workflow existing and passing does not mean
# the merge invariant is actually enforced.
#
# Trigger when PR state or reviews change.
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
  pull_request_review:
    branches: [main]
    types: [submitted, edited, dismissed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  check-disposition:
    name: disposition
    runs-on: ubuntu-latest
    steps:
      - name: Fetch current PR head SHA
        id: head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PR_NUMBER="${{ github.event.pull_request.number }}"

          HEAD_SHA=$(gh api repos/${{ github.repository }}/pulls/$PR_NUMBER \
            --jq '.head.sha')

          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "Current PR head: $HEAD_SHA"

      - name: Fetch authoritative review bodies with pagination
        id: reviews
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PR_NUMBER="${{ github.event.pull_request.number }}"

          # Fetch all reviews (paginated). `gh api` rejects --slurp combined
          # with --jq in one invocation, so --slurp collects the raw page
          # arrays here and a separate jq pipe does the rest of the work:
          #
          #  1. `add` flattens the page arrays into one ordered array.
          #  2. Only reviews from a trusted repository authority
          #     (author_association OWNER/MEMBER/COLLABORATOR) are kept.
          #     This repository is public: any user with read access can
          #     submit a review, so an unfiltered pass-through would let an
          #     unrelated external account mint a canonical READY TO MERGE
          #     block and satisfy the gate. Only accounts GitHub itself
          #     reports as having repository authority may author an
          #     authoritative disposition.
          #  3. Each surviving body is base64-encoded and emitted one per
          #     line. This is the complete normalized input the evaluator
          #     needs — a plain newline-separated list of opaque strings,
          #     not a JSON array. It needs no JSON re-parsing or ad-hoc
          #     object-boundary splitting downstream, so a review body's own
          #     content (quotes, braces, embedded JSON-looking text) can
          #     never be misread as a structural delimiter.
          BODIES=$(gh api repos/${{ github.repository }}/pulls/$PR_NUMBER/reviews \
            --paginate \
            --slurp \
            | jq -r '
                add
                | map(select(.author_association == "OWNER" or .author_association == "MEMBER" or .author_association == "COLLABORATOR"))
                | map((.body // "") | @base64)
                | .[]
              ')

          # Multiline values must use the heredoc form of GITHUB_OUTPUT with a
          # delimiter unlikely to collide with the (base64-only) payload.
          DELIM="REVIEW_BODIES_$(date +%s%N)_$RANDOM"
          {
            echo "review_bodies_b64<<$DELIM"
            echo "$BODIES"
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout repository at main (trusted base)
        # A candidate PR must not be able to modify the evaluator used to
        # authorize itself, so the evaluator always runs from main, never from
        # the PR's own (possibly attacker-controlled) checkout.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Run disposition check
        env:
          PR_HEAD_SHA: ${{ steps.head.outputs.head_sha }}
          REVIEW_BODIES_B64: ${{ steps.reviews.outputs.review_bodies_b64 }}
        run: bash .github/scripts/check-pr-disposition.sh
