name: PR Disposition

# PR review-authorization merge-gate workflow.
#
# Enforces one authorization invariant for the current PR head:
#   - a PR opened by GitHub's trusted Dependabot bot is authorized directly;
#   - every other PR requires the latest applicable canonical reviewer
#     disposition for the current head to be READY TO MERGE.
#
# This workflow does not evaluate CI, mergeability, base freshness, or
# unresolved threads — those remain independently enforced by GitHub branch
# protection and infra/dev/pr-watch.mjs.
#
# TRUST BOUNDARY (this is why the triggers below look unusual):
#
# A candidate PR must not be able to author the code that judges its own
# authorization or spoof Dependabot provenance. Checking out the evaluator
# script from a trusted `main` ref is not sufficient on its own: GitHub sources
# a `pull_request` or `pull_request_review` triggered workflow's *definition*
# from the pull request's own merge commit, not from `main`. A PR could
# therefore edit this very file to skip the evaluator and fabricate a passing
# result.
#
# Three trusted-orchestration trigger families, none of which ever checks out
# or executes PR-supplied code:
#   - `pull_request_target` for PR lifecycle events (opened/reopened/
#     synchronize). GitHub always loads a pull_request_target workflow's
#     definition from the base branch (main), never from the PR.
#   - `workflow_run`, sourced from main, for both the minimal review listener
#     and CI. The review listener provides a fast path for reviewer disposition
#     changes. CI completion provides a trusted wake for Dependabot-authored
#     PRs, which need no reviewer event. In both cases this workflow re-fetches
#     the workflow run and the PR from GitHub's API and trusts no payload or
#     code supplied by the candidate branch. CI also runs for pushes, schedules,
#     and manual dispatch; those runs have no associated PR and are a clean
#     no-op here rather than an error.
#   - `schedule`, as a trusted backstop independent of candidate-controlled
#     events. The review listener's own pull_request_review.types list is
#     PR-editable content, so a PR could narrow it and leave a later revocation
#     unable to reach the trusted evaluator via the fast path. The schedule is
#     always read from the default branch and re-checks every open PR.
#
# Dependabot provenance is derived only from the PR object re-fetched from the
# GitHub API: exact login `dependabot[bot]` plus account type `Bot`. PR title,
# branch name, labels, body, and commit author strings are candidate-controlled
# and are never provenance signals.
#
# Neither `pull_request_target`, `workflow_run`, nor `schedule` implicitly
# attaches a check result to the correct PR head SHA the way a
# `pull_request`-triggered job would, so this workflow explicitly publishes a
# check run against the resolved head SHA via the Checks API.
#
# CHECK-NAME PROVENANCE (see docs/development/reviewing.md's required-check
# provenance section):
# GitHub branch-protection required status checks match by check NAME only,
# not by which workflow produced them. A separate PR-authored workflow
# (triggered by an ordinary, untrusted event) could create its own job named
# "disposition" and satisfy the same required-check name without ever running
# this evaluator. `.github/CODEOWNERS` mitigates this: authoring or changing a
# workflow is itself a change under `.github/workflows/`, so it requires an
# owner's independent approval before it can merge.
on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize]
  workflow_run:
    workflows: ["PR Disposition Review Trigger", "CI"]
    types: [completed]
  schedule:
    # Bounded staleness backstop, independent of any PR-controlled trigger.
    - cron: '*/10 * * * *'

permissions:
  contents: read
  pull-requests: read
  actions: read
  checks: write

jobs:
  resolve-targets:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.resolve.outputs.targets }}
    steps:
      - name: Resolve PR number(s) to evaluate
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Event values are passed as data via environment variables rather
          # than interpolated directly into shell script text. The workflow-run
          # association is re-fetched from GitHub's API using the run ID instead
          # of serializing the nested pull_requests object into an expression.
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          EVENT_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail

          case "${{ github.event_name }}" in
            pull_request_target)
              TARGETS=$(jq -nc --arg n "$EVENT_PR_NUMBER" '[{pr_number: $n}]')
              ;;
            workflow_run)
              case "$EVENT_WORKFLOW_RUN_ID" in
                ''|*[!0-9]*)
                  echo "::error::workflow_run id is not numeric: $EVENT_WORKFLOW_RUN_ID" >&2
                  exit 1
                  ;;
              esac

              # Re-fetch the trusted workflow-run object from GitHub and read
              # its associated PRs there. For a pull_request_review-triggered
              # listener run, head_sha is the ephemeral refs/pull/<n>/merge
              # commit and cannot be resolved through /commits/<sha>/pulls.
              PR_NUMBER=$(gh api \
                "repos/${{ github.repository }}/actions/runs/$EVENT_WORKFLOW_RUN_ID" \
                --jq '.pull_requests[0].number // empty')

              if [ -z "$PR_NUMBER" ]; then
                # GitHub documents pull_requests as possibly empty for fork
                # cases. Fall back to the run's real source branch name.
                PR_NUMBER=$(gh pr list --repo "${{ github.repository }}" --head "$EVENT_HEAD_BRANCH" --state open --json number --jq '.[0].number // empty')
              fi

              if [ -z "$PR_NUMBER" ]; then
                if [ "$EVENT_WORKFLOW_NAME" = "CI" ]; then
                  # CI also runs for pushes to main, schedules, and manual
                  # dispatch. Those runs intentionally have no PR target.
                  TARGETS='[]'
                else
                  echo "::error::could not resolve an associated pull request for this $EVENT_WORKFLOW_NAME workflow_run event"
                  exit 1
                fi
              else
                TARGETS=$(jq -nc --arg n "$PR_NUMBER" '[{pr_number: $n}]')
              fi
              ;;
            schedule)
              TARGETS=$(gh pr list --repo "${{ github.repository }}" --state open --base main --json number --jq 'map({pr_number: (.number | tostring)})')
              ;;
            *)
              echo "::error::unexpected event: ${{ github.event_name }}"
              exit 1
              ;;
          esac

          echo "targets=$(echo "$TARGETS" | jq -c .)" >> "$GITHUB_OUTPUT"
          echo "Resolved targets: $TARGETS"

  check-disposition:
    needs: resolve-targets
    if: needs.resolve-targets.outputs.targets != '[]'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.resolve-targets.outputs.targets) }}
    concurrency:
      group: pr-disposition-${{ matrix.target.pr_number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: Resolve current PR identity and head SHA
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_PR_NUMBER: ${{ matrix.target.pr_number }}
        run: |
          set -euo pipefail
          PR_NUMBER="$TARGET_PR_NUMBER"
          case "$PR_NUMBER" in
            ''|*[!0-9]*)
              echo "::error::resolved PR number is not numeric: $PR_NUMBER" >&2
              exit 1
              ;;
          esac

          PR_JSON=$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER")
          HEAD_SHA=$(jq -r '.head.sha' <<<"$PR_JSON")
          AUTHOR_LOGIN=$(jq -r '.user.login' <<<"$PR_JSON")
          AUTHOR_TYPE=$(jq -r '.user.type' <<<"$PR_JSON")

          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "author_login=$AUTHOR_LOGIN" >> "$GITHUB_OUTPUT"
          echo "author_type=$AUTHOR_TYPE" >> "$GITHUB_OUTPUT"
          echo "Resolved PR #$PR_NUMBER, current head: $HEAD_SHA, author: $AUTHOR_LOGIN ($AUTHOR_TYPE)"

      - name: Fetch authoritative review bodies with pagination
        id: reviews
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PR_NUMBER="${{ steps.pr.outputs.pr_number }}"
          BODIES=$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER/reviews" \
            --paginate \
            --slurp \
            | jq -r '
                add
                | map(select(.author_association == "OWNER" or .author_association == "MEMBER" or .author_association == "COLLABORATOR"))
                | map((.body // "") | @base64)
                | .[]
              ')

          DELIM="REVIEW_BODIES_$(date +%s%N)_$RANDOM"
          {
            echo "review_bodies_b64<<$DELIM"
            echo "$BODIES"
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout repository at main (trusted base)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Run disposition check
        id: evaluate
        env:
          PR_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          PR_AUTHOR_LOGIN: ${{ steps.pr.outputs.author_login }}
          PR_AUTHOR_TYPE: ${{ steps.pr.outputs.author_type }}
          REVIEW_BODIES_B64: ${{ steps.reviews.outputs.review_bodies_b64 }}
        run: |
          set +e
          bash .github/scripts/check-pr-disposition.sh
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Publish disposition check
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ "${{ steps.evaluate.outputs.exit_code }}" = "0" ]; then
            CONCLUSION="success"
          else
            CONCLUSION="failure"
          fi

          gh api "repos/${{ github.repository }}/check-runs" \
            -f name="disposition" \
            -f head_sha="${{ steps.pr.outputs.head_sha }}" \
            -f status="completed" \
            -f conclusion="$CONCLUSION" \
            --silent
